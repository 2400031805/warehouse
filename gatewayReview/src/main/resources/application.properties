spring.application.name=gatewayReview

server.port=8080

# ==============================
# EUREKA
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ==============================
# AUTH SERVICE
# ==============================
spring.cloud.gateway.server.webmvc.routes[0].id=auth-review
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTHREVIEW
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**


# ==============================
# PRODUCT SERVICE
# ==============================
spring.cloud.gateway.server.webmvc.routes[1].id=product-review
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PRODUCTREVIEW
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/products/**


# ==============================
# INVENTORY SERVICE
# ==============================
spring.cloud.gateway.server.webmvc.routes[2].id=inventory-review
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://INVENTORYREVIEW
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/inventory/**


# ==============================
# ORDER SERVICE
# ==============================
spring.cloud.gateway.server.webmvc.routes[3].id=order-review
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ORDERREVIEW
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/orders/**

# ==============================
# WAREHOUSE SERVICE
# ==============================

spring.cloud.gateway.server.webmvc.routes[4].id=warehouse-review
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://INVENTORYREVIEW
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/warehouses/**